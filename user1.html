<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Humanistic AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #ffffff; }

        /* Sidebar */
        .sidebar { position: fixed; left: 0; top: 0; width: 250px; height: 100vh; background: #1a1a1a; border-right: 1px solid #2a2a2a; padding: 20px 0; z-index: 1000; }
        .logo-section { padding: 0 20px 30px; border-bottom: 1px solid #2a2a2a; }
        .logo-icon { font-size: 32px; color: #e2c36a; text-align: center; margin-bottom: 8px; }
        .logo-text { text-align: center; font-size: 18px; font-weight: 700; color: #e2c36a; }
        .nav-menu { padding: 20px 0; }
        .nav-item { padding: 12px 20px; display: flex; align-items: center; gap: 12px; color: #888; text-decoration: none; transition: all 0.3s; cursor: pointer; border-left: 3px solid transparent; }
        .nav-item:hover, .nav-item.active { background: rgba(226, 195, 106, 0.1); color: #e2c36a; border-left-color: #e2c36a; }
        .nav-item span:first-child { font-size: 20px; }

        /* Topbar */
        .topbar { position: fixed; left: 250px; top: 0; right: 0; height: 70px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; z-index: 999; }
        .page-title { color: #e2c36a; font-size: 20px; font-weight: 600; }
        .topbar-right { display: flex; gap: 12px; }
        .btn { padding: 10px 20px; background: #e2c36a; color: #0a0a0a; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn:hover { background: #d4b560; transform: translateY(-2px); }
        .btn-secondary { background: transparent; border: 1px solid #e2c36a; color: #e2c36a; }
        .btn-secondary:hover { background: rgba(226, 195, 106, 0.1); }

        /* Main Content */
        .main-content { margin-left: 250px; margin-top: 70px; padding: 30px; min-height: calc(100vh - 70px); }

        /* Filters */
        .filters { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 300px; position: relative; }
        .search-box input { width: 100%; padding: 12px 16px 12px 44px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; }
        .search-box::before { content: '🔍'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; }
        select { padding: 12px 16px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; cursor: pointer; }

        /* Table */
        .table-container { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th { text-align: left; padding: 16px; background: #0a0a0a; color: #e2c36a; font-size: 14px; font-weight: 600; border-bottom: 1px solid #2a2a2a; }
        tbody td { padding: 16px; border-bottom: 1px solid #1a1a1a; color: #ccc; }
        tbody tr:hover { background: rgba(226, 195, 106, 0.05); }

        .user-cell { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #e2c36a, #c9a556); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #0a0a0a; font-size: 14px; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { color: #fff; font-weight: 600; }
        .user-email { font-size: 12px; color: #888; }

        .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge.admin { background: rgba(226, 195, 106, 0.1); color: #e2c36a; }
        .badge.user { background: rgba(136, 136, 136, 0.1); color: #888; }
        .badge.active { background: rgba(0, 255, 0, 0.1); color: #00ff00; }
        .badge.inactive { background: rgba(255, 68, 68, 0.1); color: #ff4444; }

        .action-btns { display: flex; gap: 8px; }
        .icon-btn { padding: 6px 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; color: #888; cursor: pointer; transition: all 0.3s; }
        .icon-btn:hover { border-color: #e2c36a; color: #e2c36a; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-title { color: #e2c36a; font-size: 24px; font-weight: 700; }
        .close-btn { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
        .close-btn:hover { color: #e2c36a; }

        .form-group { margin-bottom: 20px; }
        label { display: block; color: #e2c36a; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px 16px; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; color: #fff; }
        input:focus, select:focus { outline: none; border-color: #e2c36a; }

        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }
        .page-btn { padding: 8px 12px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; color: #888; cursor: pointer; }
        .page-btn:hover, .page-btn.active { background: #e2c36a; color: #0a0a0a; border-color: #e2c36a; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-250px); }
            .topbar, .main-content { margin-left: 0; left: 0; }
            .filters { flex-direction: column; }
            .table-container { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-section">
            <div class="logo-icon">🤖</div>
            <div class="logo-text">Humanistic AI</div>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item"><span>📊</span><span>Dashboard</span></a>
            <a href="users.html" class="nav-item active"><span>👥</span><span>User Management</span></a>
            <a href="templates.html" class="nav-item"><span>📝</span><span>Templates</span></a>
            <a href="audit.html" class="nav-item"><span>🔍</span><span>Audit Trail</span></a>
            <a href="costing.html" class="nav-item"><span>💰</span><span>Cost Reports</span></a>
            <a href="profile.html" class="nav-item"><span>⚙️</span><span>Settings</span></a>
        </nav>
    </div>

    <!-- Topbar -->
    <div class="topbar">
        <div class="page-title">User Management</div>
        <div class="topbar-right">
            <button class="btn" onclick="openModal('add')">➕ Add User</button>
            <button class="btn btn-secondary" onclick="exportUsers()">📥 Export</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Filters -->
        <div class="filters">
            <div class="search-box">
                <input type="text" placeholder="Search users..." id="searchInput" onkeyup="searchUsers()">
            </div>
            <select id="roleFilter" onchange="filterUsers()">
                <option value="">All Roles</option>
                <option value="admin">Admin</option>
                <option value="user">User</option>
            </select>
            <select id="statusFilter" onchange="filterUsers()">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Role</th>
                        <th>Organization</th>
                        <th>Last Login</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTable">
                    <!-- Data will be populated by JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <button class="page-btn" onclick="changePage(-1)">←</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn" onclick="changePage(1)">→</button>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New User</h2>
                <button class="close-btn" onclick="closeModal()">✖</button>
            </div>
            <form id="userForm">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="role">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Organization</label>
                    <input type="text" id="organization" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Save User</button>
            </form>
        </div>
    </div>

    <script>
        // Sample user data
        let users = [
            { id: 1, firstName: 'Alice', lastName: 'Adams', email: 'alice@acme.com', phone: '+1-234-5678', role: 'admin', organization: 'Acme Inc', lastLogin: '2m ago', status: 'active' },
            { id: 2, firstName: 'Bob', lastName: 'Brown', email: 'bob@acme.com', phone: '+1-234-5679', role: 'user', organization: 'Acme Inc', lastLogin: '1h ago', status: 'active' },
            { id: 3, firstName: 'Carol', lastName: 'Clark', email: 'carol@beta.com', phone: '+1-234-5680', role: 'admin', organization: 'Beta Corp', lastLogin: '3h ago', status: 'active' },
            { id: 4, firstName: 'David', lastName: 'Davis', email: 'david@acme.com', phone: '+1-234-5681', role: 'user', organization: 'Acme Inc', lastLogin: '1d ago', status: 'inactive' },
            { id: 5, firstName: 'Eve', lastName: 'Evans', email: 'eve@gamma.com', phone: '+1-234-5682', role: 'admin', organization: 'Gamma LLC', lastLogin: '2d ago', status: 'active' },
        ];

        let currentEditId = null;

        function renderUsers(data = users) {
            const tbody = document.getElementById('userTable');
            tbody.innerHTML = data.map(user => `
                <tr>
                    <td>
                        <div class="user-cell">
                            <div class="user-avatar">${user.firstName[0]}${user.lastName[0]}</div>
                            <div class="user-info">
                                <div class="user-name">${user.firstName} ${user.lastName}</div>
                                <div class="user-email">${user.email}</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="badge ${user.role}">${user.role}</span></td>
                    <td>${user.organization}</td>
                    <td>${user.lastLogin}</td>
                    <td><span class="badge ${user.status}">${user.status}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="icon-btn" onclick="editUser(${user.id})" title="Edit">✎</button>
                            <button class="icon-btn" onclick="deleteUser(${user.id})" title="Delete">🗑</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(mode) {
            document.getElementById('userModal').classList.add('active');
            if (mode === 'add') {
                document.getElementById('modalTitle').textContent = 'Add New User';
                document.getElementById('userForm').reset();
                currentEditId = null;
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        function editUser(id) {
            const user = users.find(u => u.id === id);
            if (user) {
                document.getElementById('modalTitle').textContent = 'Edit User';
                document.getElementById('firstName').value = user.firstName;
                document.getElementById('lastName').value = user.lastName;
                document.getElementById('email').value = user.email;
                document.getElementById('phone').value = user.phone;
                document.getElementById('role').value = user.role;
                document.getElementById('organization').value = user.organization;
                currentEditId = id;
                openModal('edit');
            }
        }

        function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                users = users.filter(u => u.id !== id);
                renderUsers();
            }
        }

        document.getElementById('userForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const userData = {
                id: currentEditId || Date.now(),
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                role: document.getElementById('role').value,
                organization: document.getElementById('organization').value,
                lastLogin: 'Just now',
                status: 'active'
            };

            if (currentEditId) {
                const index = users.findIndex(u => u.id === currentEditId);
                users[index] = userData;
            } else {
                users.push(userData);
            }

            renderUsers();
            closeModal();
        });

        function searchUsers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = users.filter(u =>
                u.firstName.toLowerCase().includes(search) ||
                u.lastName.toLowerCase().includes(search) ||
                u.email.toLowerCase().includes(search)
            );
            renderUsers(filtered);
        }

        function filterUsers() {
            const role = document.getElementById('roleFilter').value;
            const status = document.getElementById('statusFilter').value;
            const filtered = users.filter(u =>
                (!role || u.role === role) &&
                (!status || u.status === status)
            );
            renderUsers(filtered);
        }

        function exportUsers() {
            const csv = [
                ['First Name', 'Last Name', 'Email', 'Phone', 'Role', 'Organization', 'Status'],
                ...users.map(u => [u.firstName, u.lastName, u.email, u.phone, u.role, u.organization, u.status])
            ].map(row => row.join(',')).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'users_export.csv';
            a.click();
        }

        function changePage(direction) {
            console.log('Change page:', direction);
        }

        // Check authentication
        if (!localStorage.getItem('authToken')) {
            window.location.href = 'login.html';
        }

        // Initial render
        renderUsers();
    </script>
</body>
</html>
