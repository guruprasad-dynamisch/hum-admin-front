<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Humanistic AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 48px;
            color: #e2c36a;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #e2c36a;
        }

        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(226, 195, 106, 0.1);
            border: 1px solid #2a2a2a;
        }

        h1 {
            color: #e2c36a;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2c36a;
            font-weight: 500;
            font-size: 14px;
        }

        .required {
            color: #ff4444;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #e2c36a;
            box-shadow: 0 0 0 3px rgba(226, 195, 106, 0.1);
        }

        input::placeholder {
            color: #555;
        }

        .phone-group {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #e2c36a;
            color: #0a0a0a;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #d4b560;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(226, 195, 106, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #e2c36a;
            color: #e2c36a;
        }

        .btn-secondary:hover {
            background: rgba(226, 195, 106, 0.1);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider:before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #333;
        }

        .divider span {
            background: #1a1a1a;
            padding: 0 15px;
            position: relative;
            color: #888;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            color: #888;
            font-size: 14px;
        }

        .login-link a {
            color: #e2c36a;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .otp-section {
            display: none;
            animation: fadeIn 0.3s;
        }

        .otp-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .otp-inputs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 24px 0;
        }

        .otp-input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid #333;
        }

        .otp-input:focus {
            border-color: #e2c36a;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #00ff00;
        }

        .alert-error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff4444;
        }

        .alert-info {
            background: rgba(226, 195, 106, 0.1);
            border: 1px solid rgba(226, 195, 106, 0.3);
            color: #e2c36a;
        }

        .resend-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #888;
        }

        .resend-link button {
            background: none;
            border: none;
            color: #e2c36a;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        .resend-link button:disabled {
            color: #555;
            cursor: not-allowed;
            text-decoration: none;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-top: 4px;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 400;
            color: #ccc;
            font-size: 13px;
        }

        .checkbox-group a {
            color: #e2c36a;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .helper-text {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .otp-input {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <div class="logo-text">Humanistic AI</div>
        </div>

        <div class="card">
            <!-- Registration Form -->
            <div id="registrationForm">
                <h1>Create Account</h1>
                <p class="subtitle">Sign up to get started with Humanistic AI</p>

                <div id="alertContainer"></div>

                <form id="regForm">
                    <div class="form-group">
                        <label>First Name <span class="required">*</span></label>
                        <input type="text" id="firstName" placeholder="John" required>
                    </div>

                    <div class="form-group">
                        <label>Last Name <span class="required">*</span></label>
                        <input type="text" id="lastName" placeholder="Doe" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" id="email" placeholder="john.doe@example.com" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number <span class="required">*</span></label>
                        <div class="phone-group">
                            <select id="countryCode" required>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+44">🇬🇧 +44</option>
                                <option value="+91">🇮🇳 +91</option>
                                <option value="+61">🇦🇺 +61</option>
                                <option value="+81">🇯🇵 +81</option>
                                <option value="+86">🇨🇳 +86</option>
                            </select>
                            <input type="tel" id="phone" placeholder="123-456-7890" required>
                        </div>
                        <div class="helper-text">We'll send you a verification code via SMS</div>
                    </div>

                    <div class="form-group">
                        <label>Organization <span class="required">*</span></label>
                        <input type="text" id="organization" placeholder="Acme Inc" required>
                    </div>

                    <div class="form-group">
                        <label>Role</label>
                        <select id="role">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn" id="sendOtpBtn">
                        Send Verification Code
                    </button>
                </form>

                <div class="login-link">
                    Already have an account? <a href="login.html">Sign In</a>
                </div>
            </div>

            <!-- OTP Verification Section -->
            <div id="otpSection" class="otp-section">
                <h1>Verify Phone Number</h1>
                <p class="subtitle">Enter the 6-digit code sent to <span id="phoneDisplay"></span></p>

                <div id="otpAlertContainer"></div>

                <div class="otp-inputs">
                    <input type="text" class="otp-input" maxlength="1" id="otp1">
                    <input type="text" class="otp-input" maxlength="1" id="otp2">
                    <input type="text" class="otp-input" maxlength="1" id="otp3">
                    <input type="text" class="otp-input" maxlength="1" id="otp4">
                    <input type="text" class="otp-input" maxlength="1" id="otp5">
                    <input type="text" class="otp-input" maxlength="1" id="otp6">
                </div>

                <button class="btn" id="verifyOtpBtn">Verify & Complete Registration</button>

                <div class="resend-link">
                    Didn't receive code?
                    <button id="resendBtn" disabled>Resend in <span id="countdown">60</span>s</button>
                </div>

                <button class="btn btn-secondary" id="backBtn" style="margin-top: 20px;">
                    Back to Registration
                </button>
            </div>
        </div>
    </div>

    <script>
        // Form Elements
        const regForm = document.getElementById('regForm');
        const registrationForm = document.getElementById('registrationForm');
        const otpSection = document.getElementById('otpSection');
        const alertContainer = document.getElementById('alertContainer');
        const otpAlertContainer = document.getElementById('otpAlertContainer');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const backBtn = document.getElementById('backBtn');
        const resendBtn = document.getElementById('resendBtn');
        const countdownSpan = document.getElementById('countdown');

        // OTP Inputs
        const otpInputs = document.querySelectorAll('.otp-input');
        let countdownTimer;
        let registrationData = {};

        // Auto-focus next input
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            // Allow only numbers
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Show Alert
        function showAlert(container, message, type) {
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // Start Countdown
        function startCountdown() {
            let seconds = 60;
            resendBtn.disabled = true;
            countdownSpan.textContent = seconds;

            countdownTimer = setInterval(() => {
                seconds--;
                countdownSpan.textContent = seconds;

                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend Code';
                }
            }, 1000);
        }

        // Send OTP
        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate form
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const countryCode = document.getElementById('countryCode').value;
            const phone = document.getElementById('phone').value;
            const organization = document.getElementById('organization').value;
            const role = document.getElementById('role').value;
            const terms = document.getElementById('terms').checked;

            if (!terms) {
                showAlert(alertContainer, 'Please accept the Terms of Service', 'error');
                return;
            }

            // Store registration data
            registrationData = {
                firstName,
                lastName,
                email,
                phone: countryCode + phone,
                organization,
                role
            };

            sendOtpBtn.disabled = true;
            sendOtpBtn.textContent = 'Sending...';

            // Simulate Twilio API call
            try {
                // In production, replace with actual Twilio API call:
                // const response = await fetch('/api/send-otp', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({ phone: registrationData.phone })
                // });

                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Show OTP section
                registrationForm.style.display = 'none';
                otpSection.classList.add('active');
                document.getElementById('phoneDisplay').textContent = registrationData.phone;

                // Focus first OTP input
                otpInputs[0].focus();

                // Start countdown
                startCountdown();

                showAlert(otpAlertContainer, 'Verification code sent successfully!', 'success');

            } catch (error) {
                showAlert(alertContainer, 'Failed to send verification code. Please try again.', 'error');
                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = 'Send Verification Code';
            }
        });

        // Verify OTP
        verifyOtpBtn.addEventListener('click', async () => {
            // Get OTP value
            const otp = Array.from(otpInputs).map(input => input.value).join('');

            if (otp.length !== 6) {
                showAlert(otpAlertContainer, 'Please enter the complete 6-digit code', 'error');
                return;
            }

            verifyOtpBtn.disabled = true;
            verifyOtpBtn.textContent = 'Verifying...';

            try {
                // In production, replace with actual verification API call:
                // const response = await fetch('/api/verify-otp', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({
                //         phone: registrationData.phone,
                //         otp: otp,
                //         ...registrationData
                //     })
                // });

                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Simulate success (in production, check actual response)
                if (otp === '123456' || otp.length === 6) { // Demo: accept any 6-digit code
                    showAlert(otpAlertContainer, '✓ Registration successful! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    throw new Error('Invalid OTP');
                }

            } catch (error) {
                showAlert(otpAlertContainer, 'Invalid verification code. Please try again.', 'error');
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = 'Verify & Complete Registration';

                // Clear OTP inputs
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
            }
        });

        // Resend OTP
        resendBtn.addEventListener('click', async () => {
            resendBtn.disabled = true;
            showAlert(otpAlertContainer, 'Resending verification code...', 'info');

            try {
                // In production, call resend API
                await new Promise(resolve => setTimeout(resolve, 1000));

                showAlert(otpAlertContainer, 'Verification code resent successfully!', 'success');
                startCountdown();

                // Clear OTP inputs
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();

            } catch (error) {
                showAlert(otpAlertContainer, 'Failed to resend code. Please try again.', 'error');
                resendBtn.disabled = false;
            }
        });

        // Back Button
        backBtn.addEventListener('click', () => {
            otpSection.classList.remove('active');
            registrationForm.style.display = 'block';

            // Clear OTP inputs
            otpInputs.forEach(input => input.value = '');

            // Clear countdown
            clearInterval(countdownTimer);

            // Reset send button
            sendOtpBtn.disabled = false;
            sendOtpBtn.textContent = 'Send Verification Code';
        });

        // Production Twilio Integration Notes:
        // 1. Install Twilio SDK: npm install twilio
        // 2. Backend endpoint for sending OTP:
        /*
        const twilio = require('twilio');
        const client = twilio(accountSid, authToken);

        app.post('/api/send-otp', async (req, res) => {
            try {
                const verification = await client.verify.v2
                    .services(serviceSid)
                    .verifications
                    .create({ to: req.body.phone, channel: 'sms' });

                res.json({ success: true, status: verification.status });
            } catch (error) {
                res.status(500).json({ success: false, error: error.message });
            }
        });
        */

        // 3. Backend endpoint for verifying OTP:
        /*
        app.post('/api/verify-otp', async (req, res) => {
            try {
                const verification_check = await client.verify.v2
                    .services(serviceSid)
                    .verificationChecks
                    .create({ to: req.body.phone, code: req.body.otp });

                if (verification_check.status === 'approved') {
                    // Create user account
                    // Send success response
                    res.json({ success: true });
                } else {
                    res.status(400).json({ success: false, error: 'Invalid code' });
                }
            } catch (error) {
                res.status(500).json({ success: false, error: error.message });
            }
        });
        */
    </script>
</body>
</html>
